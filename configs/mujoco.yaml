# MuJoCo Configuration based on README example
# Usage: python control/main.py --config configs/mujoco.yaml

# Algorithm settings
algo: ppo

# Learning parameters
lr: 3e-4
eps: 1e-5
alpha: 0.99
gamma: 0.99
use_gae: true
tau: 0.95
entropy_coef: 0.0
value_loss_coef: 0.5
max_grad_norm: 0.5

# Environment settings
env_name: Walker2d-v2
seed: 0
num_processes: 1
num_steps: 2048
num_frames: 3000000
add_timestep: false

# PPO specific parameters
ppo_epoch: 10
num_mini_batch: 32
clip_param: 0.1

# Logging and saving
log_interval: 1
save_interval: 100
eval_interval: null
vis_interval: 100
log_dir: /tmp/gym/
save_dir: ./saved_models/

# Hardware settings
no_cuda: false
cuda: true

# Policy settings
recurrent_policy: false
use_linear_lr_decay: false

# Visualization
vis: false
port: 8097

# Logging
use_logger: true
folder: results

# GCN parameters
gcn_epochs: 1
gcn_lr: 1e-3
gcn_weight_decay: 0e-4
gcn_hidden: 64
gcn_alpha: 0.6
gcn_lambda: 10.0
reward_freq: 20

# Minari offline dataset settings
use_minari: false

# ClearML settings
use_clearml: false
clearml_project: Phi-GCN-MuJoCo
clearml_task: mujoco_experiment